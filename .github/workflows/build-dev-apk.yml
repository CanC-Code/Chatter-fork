name: Build Dev APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Folder (Prebuild)
        # This creates the missing 'android' directory
        run: npx expo prebuild --platform android --no-install

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-Dev-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk
