name: Build Dev APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Folder (Prebuild)
        # This bundles the JS and creates the 'android' folder
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          # Changed to assembleRelease to include the JS bundle
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-Dev-Release
          # Path points to the release folder instead of debug
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
